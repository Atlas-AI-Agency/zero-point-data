<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to Zero Point Data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .success { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .success .card { max-width: 480px; background: var(--panel); border: 1px solid var(--border-2); border-radius: 20px; padding: 44px 36px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-glow); display: grid; place-items: center; margin: 0 auto 22px; color: var(--accent); font-size: 30px; }
  .success h1 { font-size: 28px; letter-spacing: -0.02em; }
  .success p { color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<div class="success">
  <div class="card">
    <div class="check">✓</div>
    <h1>You're in.</h1>
    <p>Your Zero Point Data subscription is active. Today's read and real-time alerts are now unlocked — and your API key is on its way to your inbox.</p>
    <p style="margin-top:24px"><a href="/" class="btn btn-primary btn-lg">Go to the dashboard</a></p>
  </div>
</div>
</body>
</html>
