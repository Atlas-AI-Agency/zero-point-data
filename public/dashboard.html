<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Zero Point Data</title>
<meta name="description" content="Zero Point Data dashboard — the current Bitcoin market-regime read, history, and signal attribution." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/dashboard.css" />
<script>
  (function () {
    try {
      var t = localStorage.getItem('zpd-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
</head>
<body class="dash-body">

<!-- TOP BAR -->
<nav class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>Zero Point Data <small>· dashboard</small></span>
    </div>
    <div class="nav-links">
      <a href="/">← Back to site</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="wrap dash-main">

  <!-- PAGE TITLE -->
  <header class="dash-header">
    <span class="sec-eyebrow">Live</span>
    <h1 class="dash-title">Dashboard</h1>
  </header>

  <!-- CURRENT READ SUMMARY STRIP -->
  <!-- Filled by dashboard.js from /api/v1/signal/latest -->
  <section class="dash-summary" id="dash-summary" aria-live="polite">
    <div class="ds-item ds-regime">
      <div class="ds-k">Current regime</div>
      <div class="ds-v" id="ds-regime"><span class="ds-swatch" id="ds-swatch"></span><span id="ds-regime-label">Loading…</span></div>
      <div class="ds-sub" id="ds-regime-tag"></div>
    </div>
    <div class="ds-item">
      <div class="ds-k">Risk score</div>
      <div class="ds-v ds-mono" id="ds-score">—</div>
      <div class="ds-sub" id="ds-confidence"></div>
    </div>
    <div class="ds-item">
      <div class="ds-k">BTC allocation</div>
      <div class="ds-v ds-mono" id="ds-btc">—</div>
      <div class="ds-sub">of portfolio</div>
    </div>
    <div class="ds-item">
      <div class="ds-k">Cash allocation</div>
      <div class="ds-v ds-mono" id="ds-cash">—</div>
      <div class="ds-sub" id="ds-updated"></div>
    </div>
  </section>

  <!-- MODULE MOUNT GRID -->
  <div class="dash-grid">
    <section id="dash-history"></section>
    <section id="dash-attribution"></section>
  </div>

</main>

<!-- Modules register themselves on window.ZPD_DASH, then the shell drives them. -->
<script src="/dash/history.js"></script>
<script src="/dash/attribution.js"></script>
<script src="/dashboard.js"></script>

</body>
</html>
